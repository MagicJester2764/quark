[package]
name = "quark"
version = "0.1.0"
edition = "2024"

[dependencies]
font8x8 = { version = "0.3", default-features = false }

[features]
# A kernel for testing its stacks: SYS_MEM_INFO 6 calls itself until its
# kernel stack has run out, which ends the machine with a fault that says so.
stacktest = []
# A kernel that tests the order of its locks at boot, and says so on the
# serial line: "[lockcheck] order kept".
lockcheck = []
# A kernel for testing what it makes when there is no memory to make it
# with: SYS_MEM_INFO 7 and 8 refuse the next program records and capability
# spaces, as many as asked (failtest.rs).
failtest = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
